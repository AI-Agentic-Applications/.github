name: Community Onboarding Request
description: Request Contributor guidance, Collaborator access, or Maintainer status.
title: "[Onboarding] Role Request"
labels: ["onboarding"]
body:
  - type: textarea
    id: role
    attributes:
      label: Desired Role
      description: Pre-filled from our onboarding portal (Contributor, Collaborator, or Maintainer).
    validations:
      required: true

  - type: textarea
    id: repo
    attributes:
      label: Target Repository
      description: Pre-filled from our onboarding portal.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Goals & Context
      description: What would you like to contribute or maintain?
    validations:
      required: true

  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to the Code of Conduct
          required: true
